[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "galaxy-fsspec"
version = "0.1.1"
description = "An fsspec filesystem for Galaxy histories, datasets, and collections."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "galaxy-fsspec contributors" }]
keywords = ["galaxy", "fsspec", "bioblend", "filesystem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "fsspec>=2024.1.0",
    "bioblend>=0.22.0",
    "requests>=2.31",
]

[project.optional-dependencies]
async = ["fsspec>=2024.1.0"]

[project.entry-points."fsspec.specs"]
galaxy = "galaxy_fsspec.fs:GalaxyFileSystem"

[project.urls]
Homepage = "https://github.com/galaxyproject/galaxy-fsspec"
Issues = "https://github.com/galaxyproject/galaxy-fsspec/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/galaxy_fsspec"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src/galaxy_fsspec"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=galaxy_fsspec --cov-report=term-missing"
markers = [
    "integration: tests that hit a live Galaxy instance (require GALAXY_USER_API_KEY)",
]
filterwarnings = ["error"]
